<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7655d9">
<title>Mis pastillas</title>
<link rel="manifest" href="./manifest.webmanifest">

<style>
body {
    font-family: Arial, sans-serif;
    background: #f3f0fa;
    margin: 0;
    padding: 25px 15px;
    text-align: center;
    color: #29243a;
}

h1 { color: #7655d9; }

.contenedor {
    max-width: 420px;
    margin: auto;
    background: white;
    padding: 22px;
    border-radius: 18px;
    box-shadow: 0 4px 15px #0001;
}

.dias {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin: 20px 0;
}

.dias button {
    border: 0;
    padding: 12px 4px;
    border-radius: 10px;
    background: #e9e3f7;
    color: #7655d9;
    font-weight: bold;
}

.dias button.actual {
    background: #7655d9;
    color: white;
}

.dias button.completado {
    background: #b9e8c5;
    color: #205c32;
}

.dias button:disabled {
    opacity: 0.4;
}

.pastillas {
    text-align: left;
    margin-top: 20px;
}

.pastilla {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 15px;
    margin: 10px 0;
    border-radius: 12px;
    background: #f3f0fa;
    font-size: 16px;
}

.pastilla input {
    width: 22px;
    height: 22px;
    accent-color: #7655d9;
}

#progreso {
    color: #7655d9;
    font-weight: bold;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="contenedor">
    <h1>Mis pastillas</h1>
    <p>Control semanal</p>

    <div class="dias" id="dias"></div>

    <h2 id="tituloDia"></h2>

    <div class="pastillas" id="pastillas"></div>

    <p id="progreso"></p>
    <p id="mensaje"></p>
</div>

<script>
const nombresDias = [
    "Lunes", "Martes", "Miércoles", "Jueves",
    "Viernes", "Sábado", "Domingo"
];

let datos = JSON.parse(localStorage.getItem("misPastillas")) || {
    actual: 0,
    dias: Array.from({length: 7}, () => [false, false, false, false])
};

if (!datos.dias) {
    datos.dias = Array.from({length: 7}, () => [false, false, false, false]);
}

let diaSeleccionado = datos.actual;

function guardar() {
    localStorage.setItem("misPastillas", JSON.stringify(datos));
}

function mostrar() {
    const dias = document.getElementById("dias");
    const pastillas = document.getElementById("pastillas");

    dias.innerHTML = "";
    pastillas.innerHTML = "";

    nombresDias.forEach((dia, i) => {
        const boton = document.createElement("button");
        boton.textContent = dia.substring(0, 3);

        if (i === diaSeleccionado) boton.classList.add("actual");

        if (datos.dias[i].every(Boolean)) {
            boton.classList.add("completado");
        }

        boton.disabled = i > datos.actual;
        boton.onclick = () => {
            diaSeleccionado = i;
            mostrar();
        };

        dias.appendChild(boton);
    });

    document.getElementById("tituloDia").textContent =
        nombresDias[diaSeleccionado];

    datos.dias[diaSeleccionado].forEach((marcada, i) => {
        const etiqueta = document.createElement("label");
        etiqueta.className = "pastilla";

        const casilla = document.createElement("input");
        casilla.type = "checkbox";
        casilla.checked = marcada;
        casilla.disabled = diaSeleccionado !== datos.actual;

        casilla.onchange = () => {
            datos.dias[diaSeleccionado][i] = casilla.checked;

            if (datos.dias[datos.actual].every(Boolean)) {
                if (datos.actual === 6) {
                    datos.actual = 0;
                    datos.dias = Array.from(
                        {length: 7},
                        () => [false, false, false, false]
                    );
                    diaSeleccionado = 0;
                    document.getElementById("mensaje").textContent =
                        "¡Semana completada! Empezamos de nuevo.";
                } else {
                    datos.actual++;
                    diaSeleccionado = datos.actual;
                    document.getElementById("mensaje").textContent =
                        "¡Día completado!";
                }
            } else {
                document.getElementById("mensaje").textContent = "";
            }

            guardar();
            mostrar();
        };

        etiqueta.appendChild(casilla);
        etiqueta.appendChild(
            document.createTextNode("Pastilla " + (i + 1))
        );

        pastillas.appendChild(etiqueta);
    });

    const marcadas = datos.dias[diaSeleccionado].filter(Boolean).length;

    document.getElementById("progreso").textContent =
        marcadas + " de 4 pastillas marcadas";
}

mostrar();

if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js");
}
</script>

</body>
</html>
